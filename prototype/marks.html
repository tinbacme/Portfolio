<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marks · Tin Le</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&display=swap">
<style>
  :root { --bg: #f5f5f5; --mark: #d6d6d6; --ink: #111; --mute: #767676; --cobalt: #1d3fc4; --red: #d9342b; --yellow: #ffd23f; --pine: #17694a; --cream: #f6efdd; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Be Vietnam Pro", system-ui, sans-serif; font-size: 16px; line-height: 1.4; }
  header { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding: 48px 56px 32px; }
  header span { color: var(--mute); }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; padding: 0 56px 56px; }
  .cell { display: flex; flex-direction: column; gap: 14px; }
  .hero { aspect-ratio: 1; display: grid; place-items: center; background: #ececec; border-radius: 6px; }
  .hero svg { width: 68%; height: auto; }
  .name { display: flex; justify-content: space-between; font-size: 15px; }
  .name span { color: var(--mute); }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #fff; border-radius: 6px; font-size: 14px; }
  .head svg { width: 22px; height: 22px; }
  .plates { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .plates div { aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center; }
  .plates svg { width: 62%; height: auto; }
  .p1 { background: var(--cobalt); } .p2 { background: var(--red); } .p3 { background: var(--yellow); } .p4 { background: var(--pine); } .p5 { background: var(--cream); }
  .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) forwards; animation-delay: calc(var(--i) * 38ms + 200ms); }
  @keyframes pop { from { opacity: 0; transform: scale(.2) rotate(-40deg); } to { opacity: 1; transform: none; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .a { animation: none; opacity: 1; } .spin { animation: none; } }
</style>
</head>
<body>
<header><div>Hello, I'm Tin<br><span>Five marks to choose from</span></div><div>Drawn as crests<br><span>so they work at 16 px and at 600 px</span></div><div>Each one assembles<br><span>part by part when the page loads</span></div></header>
<main class="grid" id="grid"></main>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const P = (d, extra = '') => `<path d="${d}" ${extra}/>`;
  const C = (x, y, r, extra = '') => `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${r}" ${extra}/>`;
  const rad = a => a * Math.PI / 180;
  // Each mark returns a list of SVG elements drawn in "fill" color with "cut" for negative-space details.
  const marks = {
    mai: { title: 'Hoa mai', note: 'Tết blossom', draw(f, cut) {
      const out = [];
      for (let i = 0; i < 5; i++) { const a = rad(i * 72 - 90), x = 100 + Math.cos(a) * 40, y = 100 + Math.sin(a) * 40;
        out.push(`<g transform="rotate(${i * 72} 100 100)"><path d="M100 100 C 70 78, 66 36, 100 30 C 134 36, 130 78, 100 100 Z" fill="${f}" transform="translate(0 -4)"/><path d="M100 36 l0 10" stroke="${cut}" stroke-width="3" stroke-linecap="round"/></g>`); }
      for (let i = 0; i < 10; i++) { const a = rad(i * 36 - 72), x = 100 + Math.cos(a) * 26, y = 100 + Math.sin(a) * 26;
        out.push(`<g><path d="M100 100 L${x.toFixed(1)} ${y.toFixed(1)}" stroke="${cut}" stroke-width="2"/>${C(x, y, 3.2, `fill="${cut}"`)}</g>`); }
      out.push(C(100, 100, 9, `fill="${cut}"`)); return out; } },
    daquy: { title: 'Dã quỳ', note: 'Đà Lạt in November', draw(f, cut) {
      const out = [];
      for (let i = 0; i < 14; i++) out.push(`<path d="M100 100 C 92 80, 92 40, 98 22 L100 28 L102 22 C 108 40, 108 80, 100 100 Z" fill="${f}" transform="rotate(${i * (360 / 14)} 100 100)"/>`);
      out.push(C(100, 100, 30, `fill="${f}" stroke="${cut}" stroke-width="3"`));
      for (let i = 0; i < 34; i++) { const r = 4 * Math.sqrt(i + .5), a = i * 137.508; out.push(C(100 + Math.cos(rad(a)) * r * 1.0, 100 + Math.sin(rad(a)) * r * 1.0, 2.1, `fill="${cut}"`)); }
      return out; } },
    pine: { title: 'Pine cone', note: 'Đà Lạt and Oregon', draw(f, cut) {
      const out = [];
      for (let i = 1; i < 72; i++) { const r = 8.6 * Math.sqrt(i), a = i * 137.508, x = 100 + Math.cos(rad(a)) * r, y = 100 + Math.sin(rad(a)) * r, s = 3 + Math.sqrt(i) * 1.15;
        out.push(`<path d="M${(x - s).toFixed(1)} ${y.toFixed(1)} Q ${x.toFixed(1)} ${(y - s * 1.3).toFixed(1)} ${(x + s).toFixed(1)} ${y.toFixed(1)} Q ${x.toFixed(1)} ${(y + s * .9).toFixed(1)} ${(x - s).toFixed(1)} ${y.toFixed(1)} Z" fill="${f}" transform="rotate(${(a + 90).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`); }
      out.push(C(100, 100, 5, `fill="${f}"`)); return out; } },
    phin: { title: 'Phin filter', note: 'Seen from above', draw(f, cut) {
      const out = [];
      out.push(`<rect x="14" y="88" width="172" height="24" rx="12" fill="${f}"/>`);
      out.push(C(100, 100, 72, `fill="${f}"`));
      out.push(C(100, 100, 60, `fill="none" stroke="${cut}" stroke-width="4"`));
      out.push(C(100, 100, 46, `fill="none" stroke="${cut}" stroke-width="2"`));
      for (let ring = 0; ring < 3; ring++) { const n = [1, 8, 14][ring], r = [0, 17, 32][ring];
        for (let i = 0; i < n; i++) { const a = rad(i * 360 / n + ring * 11); out.push(C(100 + Math.cos(a) * r, 100 + Math.sin(a) * r, 3.4, `fill="${cut}"`)); } }
      out.push(`<rect x="94" y="22" width="12" height="20" rx="4" fill="${cut}"/>`);
      return out; } },
    nut: { title: 'Hex nut “T”', note: 'Maker’s monogram', draw(f, cut) {
      const out = [], pts = [...Array(6)].map((_, i) => { const a = rad(i * 60 + 30); return `${(100 + Math.cos(a) * 80).toFixed(1)},${(100 + Math.sin(a) * 80).toFixed(1)}`; }).join(' ');
      out.push(`<polygon points="${pts}" fill="${f}"/>`);
      out.push(C(100, 100, 58, `fill="none" stroke="${cut}" stroke-width="3"`));
      for (let i = 0; i < 6; i++) { const a = rad(i * 60); out.push(C(100 + Math.cos(a) * 68, 100 + Math.sin(a) * 68, 2.6, `fill="${cut}"`)); }
      out.push(`<path d="M68 68 H132 V84 H108 V136 H92 V84 H68 Z" fill="${cut}"/>`);
      return out; } },
  };
  const svg = (k, f, cut, animate) => {
    const els = marks[k].draw(f, cut).map((e, i) => animate ? `<g class="a" style="--i:${i}">${e}</g>` : e).join('');
    return `<svg viewBox="0 0 200 200" role="img" aria-label="${marks[k].title} mark"><g class="${animate ? 'spin' : ''}">${els}</g></svg>`;
  };
  const plates = [['p1', '#f6efdd', '#1d3fc4'], ['p2', '#ffd23f', '#d9342b'], ['p3', '#d9342b', '#ffd23f'], ['p4', '#f6efdd', '#17694a'], ['p5', '#17694a', '#f6efdd']];
  document.getElementById('grid').innerHTML = Object.keys(marks).map(k => `
    <section class="cell">
      <div class="hero">${svg(k, '#d2d2d2', '#ececec', true)}</div>
      <div class="name">${marks[k].title}<span>${marks[k].note}</span></div>
      <div class="head"><span>Tin Le</span>${svg(k, '#111', '#fff', false)}</div>
      <div class="plates">${plates.map(([c, f, cut]) => `<div class="${c}">${svg(k, f, cut, false)}</div>`).join('')}</div>
    </section>`).join('');
</script>
</body>
</html>
