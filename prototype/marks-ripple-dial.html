<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple and Dial marks · Tin Le</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&display=swap">
<style>
  :root { --bg: #f5f5f5; --ink: #111; --mute: #707070; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Be Vietnam Pro", system-ui, sans-serif; font-size: 16px; line-height: 1.4; }
  header { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding: 48px 56px 32px; }
  header span { color: var(--mute); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 20px; padding: 0 56px 56px; }
  .cell { display: flex; flex-direction: column; gap: 12px; }
  .hero { aspect-ratio: 16 / 10; display: grid; place-items: center; background: #ececec; border-radius: 6px; }
  .hero svg { height: 64%; width: auto; }
  .name { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
  .name span { color: var(--mute); text-align: right; }
  .row { display: grid; grid-template-columns: 1.6fr repeat(5, minmax(0, 1fr)); gap: 6px; }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 0 12px; background: #fff; border-radius: 4px; font-size: 14px; }
  .head svg { width: 20px; height: 20px; }
  .pl { aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center; }
  .pl svg { width: 58%; height: 58%; }
  .a { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3, 1.5, .5, 1) forwards; animation-delay: calc(var(--i) * 80ms + 200ms); }
  @keyframes pop { from { opacity: 0; transform: scale(.4) translateY(-8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .a { animation: none; opacity: 1; } }
</style>
</head>
<body>
<header><div>Hello, I'm Tin<br><span>Ripple and Dial, refined</span></div><div>One small change, a maker's knob<br><span>and one that combines them</span></div><div>A few parts each<br><span>so it reads at 16 px</span></div></header>
<main class="grid" id="grid"></main>
<script>
  const rad = a => a * Math.PI / 180, f1 = n => n.toFixed(1);
  const drop = (x, y, s, f) => `<path d="M${x} ${y - s * 1.6} C ${x + s * .9} ${y - s * .3}, ${x + s} ${y + s * .3}, ${x} ${y + s} C ${x - s} ${y + s * .3}, ${x - s * .9} ${y - s * .3}, ${x} ${y - s * 1.6} Z" fill="${f}"/>`;
  const arc = (r, a0, a1, f, w = 10) => { const p = a => [100 + Math.cos(rad(a)) * r, 100 + Math.sin(rad(a)) * r]; const [x0, y0] = p(a0), [x1, y1] = p(a1); return `<path d="M${f1(x0)} ${f1(y0)} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f1(x1)} ${f1(y1)}" fill="none" stroke="${f}" stroke-width="${w}" stroke-linecap="round"/>`; };
  const ticks = (f, n, r0, r1, a0 = 135, a1 = 405, w = 6) => [...Array(n)].map((_, i) => { const a = rad(a0 + (a1 - a0) * i / (n - 1)); return `<path d="M${f1(100 + Math.cos(a) * r0)} ${f1(100 + Math.sin(a) * r0)} L${f1(100 + Math.cos(a) * r1)} ${f1(100 + Math.sin(a) * r1)}" stroke="${f}" stroke-width="${w}" stroke-linecap="round"/>`; });
  const marks = [
    { t: 'Ripple A', n: 'Dot and three open rings', draw(f, c) { return [`<circle cx="100" cy="100" r="13" fill="${f}"/>`, arc(38, -90, 200, f), arc(64, -90, 220, f), arc(90, -90, 240, f)]; } },
    { t: 'Ripple B', n: 'Off-center: the change at one edge', draw(f, c) { return [`<circle cx="54" cy="146" r="13" fill="${f}"/>`, ...[40, 72, 104, 136].map(r => `<path d="M${54 + r} 146 A ${r} ${r} 0 0 0 54 ${146 - r}" fill="none" stroke="${f}" stroke-width="10" stroke-linecap="round"/>`)]; } },
    { t: 'Ripple C', n: 'Dot and two rings, the quietest', draw(f, c) { return [`<circle cx="100" cy="100" r="16" fill="${f}"/>`, `<circle cx="100" cy="100" r="50" fill="none" stroke="${f}" stroke-width="10"/>`, `<circle cx="100" cy="100" r="84" fill="none" stroke="${f}" stroke-width="10" stroke-dasharray="1 30" stroke-linecap="round"/>`]; } },
    { t: 'Dial A', n: 'Knob with a 270° scale', draw(f, c) { return [...ticks(f, 9, 80, 94), `<circle cx="100" cy="100" r="62" fill="${f}"/>`, `<rect x="94" y="46" width="12" height="36" rx="6" fill="${c}" transform="rotate(-40 100 100)"/>`]; } },
    { t: 'Dial B', n: 'Knurled knob, from above', draw(f, c) { const out = [`<circle cx="100" cy="100" r="84" fill="${f}"/>`]; for (let i = 0; i < 36; i++) { const a = rad(i * 10); out.push(`<circle cx="${f1(100 + Math.cos(a) * 84)}" cy="${f1(100 + Math.sin(a) * 84)}" r="5" fill="${c}"/>`); } out.push(`<circle cx="100" cy="100" r="56" fill="none" stroke="${c}" stroke-width="4"/>`, `<circle cx="100" cy="46" r="9" fill="${c}"/>`); return out; } },
    { t: 'Dial + ripple', n: 'Turn the knob, the change spreads', draw(f, c) { return [`<circle cx="100" cy="100" r="44" fill="${f}"/>`, `<rect x="95" y="62" width="10" height="28" rx="5" fill="${c}" transform="rotate(35 100 100)"/>`, arc(66, 150, 390, f, 9), arc(90, 165, 375, f, 9)]; } },
  ];
  const svg = (m, f, c, animate) => `<svg viewBox="0 0 200 200" role="img" aria-label="${m.t} mark">${m.draw(f, c).map((e, i) => animate ? `<g class="a" style="--i:${i}">${e}</g>` : e).join('')}</svg>`;
  const plates = [['#1d3fc4', '#f6efdd'], ['#d9342b', '#ffd23f'], ['#ffd23f', '#d9342b'], ['#17694a', '#f6efdd'], ['#f6efdd', '#17694a']];
  document.getElementById('grid').innerHTML = marks.map(m => `
    <section class="cell">
      <div class="hero">${svg(m, '#cfcfcf', '#ececec', true)}</div>
      <div class="name">${m.t}<span>${m.n}</span></div>
      <div class="row"><div class="head"><span>Tin Le</span>${svg(m, '#111', '#fff', false)}</div>${plates.map(([bg, f]) => `<div class="pl" style="background:${bg}">${svg(m, f, bg, false)}</div>`).join('')}</div>
    </section>`).join('');
</script>
</body>
</html>
