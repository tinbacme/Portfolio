<style>
body{margin:0}
a{color:#141414;text-decoration:none}a:hover{color:#141414;text-decoration:underline;text-underline-offset:3px}
.th-loop img{transition:opacity .12s, transform .28s cubic-bezier(.3,1.6,.5,1)}
sc-for, sc-if { display: contents; }
.th-co .lg{filter:grayscale(1) opacity(.55);transition:filter .25s}
.th-co:hover .lg,.th-co:focus-within .lg{filter:none}
.th-co p{transition:color .25s}
.th-co:hover p,.th-co:focus-within p{color:#141414 !important}
.th-co{align-self:flex-start;margin-left:-10px;padding:4px 10px;border-radius:200px;transition:background-color .25s}
.th-co:hover,.th-co:focus-within{background-color:#e7e7e7}
/* About collage: photos ride a ring turning around a vertical axis (from "4 About") */
@keyframes ab-orbit { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
@keyframes ab-face { from { transform: rotateY(0deg); } to { transform: rotateY(-360deg); } }
@keyframes ab-bob { from { translate: 0 calc(var(--float) * -1); } to { translate: 0 var(--float); } }
.ab-board { perspective: var(--persp); }
.ab-stage { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; animation: ab-orbit var(--turn) linear infinite; animation-direction: var(--dir); animation-play-state: var(--play); }
.ab-slot { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform: rotateY(var(--a)) translateZ(var(--radius)) rotateY(calc(var(--a) * -1)) translateY(var(--y)); }
.ab-face { position: absolute; left: 0; top: 0; transform-style: preserve-3d; animation: ab-face var(--turn) linear infinite; animation-direction: var(--dir); animation-play-state: var(--play); }
.ab-item { position: absolute; rotate: calc(var(--tilt) * var(--r)); box-shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.35); animation: ab-bob var(--d) ease-in-out var(--delay) infinite alternate; animation-play-state: var(--play); transition: scale 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
.ab-lift .ab-item:hover { scale: 1.1; }
.ab-hold:hover .ab-stage, .ab-hold:hover .ab-face { animation-play-state: paused; }
.ab-toggle:hover { background: rgba(127, 127, 127, 0.18); }
.ab-toggle:focus-visible { outline: 2px solid #3078e7; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .ab-stage, .ab-face, .ab-item { animation: none; } }
@media (max-width: 820px){
  .th-hero{grid-template-columns:1fr !important;gap:36px !important;padding-top:48px !important}
  .th-hero-mark{order:-1;justify-self:start !important;width:150px !important}
  .th-shots{grid-template-columns:1fr !important}
  .th-side{grid-template-rows:none !important;grid-template-columns:1fr 1fr !important}
  .th-small{aspect-ratio:4 / 3}
  .th-meta{grid-template-columns:1fr !important;gap:2px !important}
  .th-trail{display:none}
}
/* About: once the photos no longer fit beside the text, stack them above "Hi I am Tin" */
@media (max-width: 1389px){
  #about .ab-board{order:-1}
}

/* Header on scroll: page colour fading out downward + progressive blur (strongest at the top) */
.th-head{isolation:isolate}
.th-fade{position:absolute;left:0;right:0;top:0;height:calc(100% + 56px);pointer-events:none;z-index:-1}
.th-fade::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(245,245,245,.94) 0%,rgba(245,245,245,.8) 45%,rgba(245,245,245,0) 100%);opacity:var(--hf-o,1)}
.th-fade i{position:absolute;inset:0}
.th-fade i:nth-child(1){--b:1px;-webkit-mask:linear-gradient(#000 0 55%,transparent 100%);mask:linear-gradient(#000 0 55%,transparent 100%)}
.th-fade i:nth-child(2){--b:3px;-webkit-mask:linear-gradient(#000 0 42%,transparent 78%);mask:linear-gradient(#000 0 42%,transparent 78%)}
.th-fade i:nth-child(3){--b:6px;-webkit-mask:linear-gradient(#000 0 28%,transparent 60%);mask:linear-gradient(#000 0 28%,transparent 60%)}
.th-fade i:nth-child(4){--b:12px;-webkit-mask:linear-gradient(#000 0 14%,transparent 42%);mask:linear-gradient(#000 0 14%,transparent 42%)}
.th-fade i{-webkit-backdrop-filter:blur(var(--b));backdrop-filter:blur(var(--b))}
.hf-off .th-fade{display:none}
@keyframes hf-in-c{from{opacity:0}to{opacity:1}}
@keyframes hf-in-b{from{-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}to{-webkit-backdrop-filter:blur(var(--b));backdrop-filter:blur(var(--b))}}
@supports (animation-timeline: scroll()){
  .hf-scroll .th-fade::before{animation:hf-in-c linear both;animation-timeline:scroll(nearest);animation-range:0 140px}
  .hf-scroll .th-fade i{animation:hf-in-b linear both;animation-timeline:scroll(nearest);animation-range:0 140px}
}
</style>

<script>
/* dc-lite: runs a Claude Design board (.dc.html) as a plain web page.
   Supports what the homepage board uses: {{holes}} in text and attributes,
   on* event attributes, ref, <sc-for list as>, <sc-if value>, and a
   React-style class (props, state, setState, lifecycle, renderVals). */
(function () {
  const HOLE = /\{\{\s*([^}]*?)\s*\}\}/g;
  const ONE = /^\{\{\s*([^}]*?)\s*\}\}$/;
  const EVT = { focus: 'focusin', blur: 'focusout' };

  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(u, cb) {
      const prev = this.state;
      const v = typeof u === 'function' ? u(this.state, this.props) : u;
      this.state = Object.assign({}, this.state, v);
      this.__dc && this.__dc.schedule(prev, cb);
    }
    forceUpdate(cb) { this.__dc && this.__dc.schedule(this.state, cb); }
  }
  window.DCLogic = DCLogic;

  function lookup(scope, expr) {
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (expr === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    if (/^(['"]).*\1$/.test(expr)) return expr.slice(1, -1);
    const parts = expr.split('.');
    let v = scope(parts[0]);
    for (let i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  const interp = (str, scope) => {
    const m = str.match(ONE);
    if (m) { const v = lookup(scope, m[1]); return v == null ? '' : String(v); }
    return str.replace(HOLE, (_, e) => { const v = lookup(scope, e); return v == null ? '' : String(v); });
  };

  function mount(tplRoot, host, comp) {
    let vals = {};
    const top = (k) => vals[k];
    const refs = [];

    // Build real DOM from a template node; returns { node, binds[] }
    function build(t, scope, binds) {
      if (t.nodeType === 3) {
        const n = document.createTextNode(t.data);
        if (t.data.includes('{{')) { const src = t.data; binds.push(() => { const v = interp(src, scope); if (n.data !== v) n.data = v; }); }
        return n;
      }
      if (t.nodeType !== 1) return document.createComment('');
      const tag = t.localName;
      if (tag === 'helmet') return document.createComment('helmet');
      if (tag === 'sc-for') return buildFor(t, scope, binds);
      if (tag === 'sc-if') return buildIf(t, scope, binds);
      const el = t.namespaceURI && t.namespaceURI !== 'http://www.w3.org/1999/xhtml'
        ? document.createElementNS(t.namespaceURI, t.localName) : document.createElement(tag);
      for (const a of Array.from(t.attributes)) {
        const name = a.name, val = a.value;
        if (name.startsWith('hint-')) continue;
        if (name.length > 2 && name.startsWith('on') && val.includes('{{')) {
          const key = (val.match(ONE) || [])[1];
          const ev = name.slice(2).toLowerCase();
          el.addEventListener(EVT[ev] || ev, (e) => { const fn = lookup(scope, key); if (typeof fn === 'function') fn(e); });
          continue;
        }
        if (name === 'ref') { const key = (val.match(ONE) || [])[1]; refs.push(() => { const fn = lookup(scope, key); if (typeof fn === 'function') fn(el); }); continue; }
        if (val.includes('{{')) {
          binds.push(() => { const v = interp(val, scope); if (el.getAttribute(name) !== v) a.namespaceURI ? el.setAttributeNS(a.namespaceURI, name, v) : el.setAttribute(name, v); });
          continue;
        }
        a.namespaceURI ? el.setAttributeNS(a.namespaceURI, name, val) : el.setAttribute(name, val);
      }
      const kids = tag === 'template' ? t.content.childNodes : t.childNodes;
      for (const c of Array.from(kids)) el.appendChild(build(c, scope, binds));
      return el;
    }

    function buildIf(t, scope, binds) {
      const el = document.createElement('sc-if');
      const key = (t.getAttribute('value') || '').match(ONE);
      let built = false;
      binds.push(() => {
        const on = !!(key ? lookup(scope, key[1]) : false);
        if (on && !built) { built = true; const inner = []; for (const c of Array.from(t.childNodes)) el.appendChild(build(c, scope, inner)); binds.push(...inner); inner.forEach((f) => f()); }
        el.style.display = on ? 'contents' : 'none';
      });
      return el;
    }

    function buildFor(t, scope, binds) {
      const el = document.createElement('sc-for');
      const key = (t.getAttribute('list') || '').match(ONE), as = t.getAttribute('as') || 'item';
      const items = [];
      binds.push(() => {
        const list = (key && lookup(scope, key[1])) || [];
        for (let i = 0; i < list.length; i++) {
          if (!items[i]) {
            const it = { value: list[i], binds: [], nodes: [] };
            const s = (k) => (k === as ? it.value : k === as + 'Index' ? i : scope(k));
            for (const c of Array.from(t.childNodes)) { const n = build(c, s, it.binds); it.nodes.push(n); el.appendChild(n); }
            items[i] = it;
          }
          items[i].value = list[i];
          items[i].binds.forEach((f) => f());
        }
        while (items.length > list.length) items.pop().nodes.forEach((n) => n.remove());
      });
      return el;
    }

    const binds = [];
    const frag = document.createDocumentFragment();
    for (const c of Array.from(tplRoot.childNodes)) frag.appendChild(build(c, top, binds));
    const update = () => { vals = comp.renderVals() || {}; binds.forEach((f) => f()); };
    update();
    host.appendChild(frag);
    refs.forEach((f) => f());

    let queued = false, prevState = null, cbs = [];
    comp.__dc = {
      schedule(prev, cb) {
        if (!queued) { prevState = prev; queued = true; Promise.resolve().then(() => {
          queued = false; update();
          if (comp.componentDidUpdate) try { comp.componentDidUpdate(comp.props, prevState); } catch (e) { console.error(e); }
          const c = cbs; cbs = []; c.forEach((f) => f());
        }); }
        if (cb) cbs.push(cb);
      },
    };
    if (comp.componentDidMount) comp.componentDidMount();
  }

  window.dcLite = {
    run({ template, host, Component, props }) {
      const comp = new Component(props);
      mount(template.content, host, comp);
      window.addEventListener('pagehide', () => comp.componentWillUnmount && comp.componentWillUnmount());
      return comp;
    },
  };
})();

</script>
