<style>
body{margin:0}
a{color:#1b2930}a:hover{color:#000}
.pm-a, .pm-b { mix-blend-mode: multiply; opacity: 0.9; transform-box: fill-box; }
.pm-a { animation: pm-pressA 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
.pm-b { animation: pm-pressB 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
.th-a { animation: pm-thudA 0.7s ease-out both; }
.th-b { animation: pm-thudB 0.7s ease-out both; }
@keyframes pm-pressA { 0% { opacity: 0; scale: 1.7; filter: blur(3px); } 50% { opacity: 0; scale: 1.15; filter: blur(1px); } 62% { opacity: 1; scale: 0.95; filter: blur(0); } 78% { scale: 1.02; } 100% { opacity: 0.9; scale: 1; } }
@keyframes pm-pressB { 0% { opacity: 0; scale: 1.7; filter: blur(3px); } 50% { opacity: 0; scale: 1.15; filter: blur(1px); } 62% { opacity: 1; scale: 0.95; filter: blur(0); } 78% { scale: 1.02; } 100% { opacity: 0.9; scale: 1; } }
@keyframes pm-thudA { 0%, 58% { translate: 0 0; scale: 1; } 64% { translate: 0 2px; scale: 0.985; } 100% { translate: 0 0; scale: 1; } }
@keyframes pm-thudB { 0%, 58% { translate: 0 0; scale: 1; } 64% { translate: 0 2px; scale: 0.985; } 100% { translate: 0 0; scale: 1; } }
figure:nth-child(2) .pm-a, figure:nth-child(2) .pm-b, figure:nth-child(2) .th-a, figure:nth-child(2) .th-b { animation-delay: 0.25s; }
figure:nth-child(3) .pm-a, figure:nth-child(3) .pm-b, figure:nth-child(3) .th-a, figure:nth-child(3) .th-b { animation-delay: 0.5s; }
figure:nth-child(4) .pm-a, figure:nth-child(4) .pm-b, figure:nth-child(4) .th-a, figure:nth-child(4) .th-b { animation-delay: 0.75s; }
figure:nth-child(5) .pm-a, figure:nth-child(5) .pm-b, figure:nth-child(5) .th-a, figure:nth-child(5) .th-b { animation-delay: 1s; }
.restamp:hover { background: #1b2930; color: #fbf9f4; }
.restamp:focus-visible { outline: 2px solid #3078e7; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .pm-a, .pm-b, .th-a, .th-b { animation: none; } }
</style>

<script type="text/x-dc" data-dc-script data-props='{"knowLocation": {"editor": "boolean", "default": true, "section": "Visitor"}, "showNote": {"editor": "boolean", "default": true, "section": "Note"}, "location": {"editor": "text", "default": "United States", "section": "Visitor"}, "ink": {"editor": "enum", "default": "each design", "options": ["each design", "slate blue", "postal red", "forest green", "violet", "black"], "section": "Ink"}, "texture": {"editor": "range", "default": 0.5, "min": 0, "max": 2, "step": 0.1, "section": "Ink"}, "opacity": {"editor": "range", "default": 0.9, "min": 0.4, "max": 1, "step": 0.05, "section": "Ink"}, "tilt": {"editor": "range", "default": -6, "min": -25, "max": 25, "step": 1, "unit": "°", "section": "Ink"}, "$preview": {"width": 1440, "height": 1160}}'>
const DESIGN_INK = {"1": "#3d5a8a", "2": "#2a2f36", "3": "#b23a3a", "4": "#5b4a8a", "5": "#c2552d"};
const PAPER_TILT = -12;
const INKS = { 'slate blue': '#3d5a8a', 'postal red': '#b23a3a', 'forest green': '#2f6b4f', 'violet': '#5b4a8a', 'black': '#2a2f36' };
const WIDTHS = {"1": 146, "2": 170, "3": 156, "4": 142, "5": 166};
class Component extends DCLogic {
  renderVals() {
    const p = this.props, s = this.state || {};
    const known = p.knowLocation ?? true;
    const place = String(p.location ?? 'United States').trim().toUpperCase();
    const now = new Date();
    const mon = now.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
    const dd = String(now.getDate()).padStart(2, '0');
    const yyyy = String(now.getFullYear());
    const tex = p.texture ?? 0.5;
    const tilt = p.tilt ?? -6;
    const note = p.showNote ?? true;
    const out = {
      stampCls: s.k ? 'pm-a' : 'pm-b',
      thudCls: s.k ? 'th-a' : 'th-b',
      restamp: () => this.setState({ k: !s.k }),
      showNote: note,
      // The stamp's paper (inside the perforations), turned to match the art's tilt.
      paper: `position: absolute; left: 37px; top: 31px; width: 180px; height: 238px; transform: rotate(${PAPER_TILT}deg); display: flex; flex-direction: column; align-items: center; justify-content: ${note ? 'space-between' : 'center'}; padding: 20px 0 22px; box-sizing: border-box;`,
      loc: known && place ? place : 'YOU VISITED TIN',
      sub: known && place ? 'VISITED TIN' : 'TIN LE · PORTFOLIO',
      subShort: 'TIN LE',
      locShort: known && place ? place : 'YOU VISITED TIN',
      fromLoc: known && place ? `FROM ${place} · TO TIN` : 'YOU VISITED TIN',
      day: `${mon} ${dd}`, year: yyyy, dmy: `${dd} ${mon} ${yyyy}`, full: `${mon} ${dd} ${yyyy}`,
      disp: (1.8 * tex).toFixed(2),
      speck: tex < 0.3 ? '1 1' : (tex >= 1.3 ? '1 1 0.25 1 0.4 1' : '1 1 1 1 0.5 1 1 1'),
    };
    for (let i = 1; i <= 5; i++) {
      const color = (p.ink ?? 'each design') === 'each design' ? DESIGN_INK[i] : INKS[p.ink];
      const w = WIDTHS[i];
      out['m' + i] = `display: block; flex: none; width: ${w}px; height: auto; overflow: visible; color: ${color}; opacity: ${p.opacity ?? 0.9}; transform: rotate(${tilt}deg); mix-blend-mode: multiply;`;
    }
    return out;
  }
}
</script>
</body>
