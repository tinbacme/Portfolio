body{margin:0}
a{color:#1b2930;text-decoration:none}a:hover{color:#000}
@keyframes tin-fly { from { left: var(--x0); top: var(--y0); } to { left: var(--x1); top: var(--y1); } }

.tin-stamp-art { transition: rotate 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
.tin-postmark { transition: translate 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s; }
.tin-stamp:hover .tin-stamp-art { rotate: 4deg; }
.tin-stamp:hover .tin-postmark { translate: 36px -6px; animation: tin-wave 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.5s infinite; }
@keyframes tin-wave { 0% { translate: 36px -6px; opacity: 1; } 70% { translate: 64px -10px; opacity: 0; } 71% { translate: 20px -4px; opacity: 0; } 100% { translate: 36px -6px; opacity: 1; } }
.tin-whisk { opacity: 0; translate: -54px -44px; rotate: -30deg; transition: opacity 0.3s 0.45s, translate 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.2s, rotate 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.2s; }
.tin-whisk-dip { translate: 0 0; transition: translate 0.25s cubic-bezier(0.22, 1, 0.36, 1); }
.tin-matcha:hover .tin-whisk, .tin-matcha:focus-visible .tin-whisk { opacity: 1; translate: 0 -30px; rotate: 0deg; transition: opacity 0.2s, translate 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.15s, rotate 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.15s; }
.tin-matcha:hover .tin-whisk-dip, .tin-matcha:focus-visible .tin-whisk-dip { translate: 0 30px; transition: translate 0.4s cubic-bezier(0.34, 1.3, 0.64, 1) 0.6s; }
.tin-spin { position: absolute; inset: 0; animation: tin-swirl var(--d, 9s) linear infinite; }
.tin-matcha:focus-visible { outline: 2px solid #3078e7; outline-offset: 6px; border-radius: 12px; }
@keyframes tin-whisking { 0% { translate: -12px 0; rotate: -7deg; } 50% { translate: 12px 2px; rotate: 7deg; } 100% { translate: -12px 0; rotate: -7deg; } }
@keyframes tin-swirl { to { rotate: 360deg; } }
.tin-steam { opacity: 0; transform-origin: 50% 100%; animation: tin-steam 3.4s ease-in-out infinite both; }
@keyframes tin-steam { 0% { opacity: 0; translate: 0 8px; scale: 1 0.9; } 25% { opacity: 0.9; } 60% { translate: 2px -6px; } 100% { opacity: 0; translate: -2px -18px; scale: 1.05 1.1; } }
.tin-matcha:hover .tin-steam { animation-duration: 2.4s; }
@media (prefers-reduced-motion: reduce) { [style*="tin-fly"], [style*="tin-draw"] { animation: none !important; clip-path: none !important; } .tin-stamp:hover .tin-postmark { animation: none; } [style*="tin-whisking"], [style*="tin-swirl"], .tin-spin { animation: none !important; } .tin-steam { animation: none; opacity: 0.8; } }

class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const animate = p.animate ?? true;
    const count = Math.max(1, Math.min(5, p.planeCount ?? 2));
    const first = p.firstDelay ?? 0.5;
    const gap = p.interval ?? 3;
    const dur = p.duration ?? 6;
    const dir = p.direction ?? 'left to right';
    const path = p.path ?? 'climbing';
    const ease = p.easing ?? 'linear';
    const size = p.planeSize ?? 36;
    const trail = p.contrail ?? true;
    const repeat = p.repeat ?? true;
    const avoid = p.avoidOverlap ?? true;
    const paths = { level: [45, 45], climbing: [75, 12], descending: [12, 75] };
    const randomish = [[70, 20], [30, 55], [60, 10], [20, 70], [50, 35]];
    // Lane mode: each plane keeps to its own horizontal band of the window, so paths never cross.
    // Plane height as % of the glass height is about half its width setting.
    const planeH = size * 0.5;
    const lane = 100 / count;
    const shape = { level: [0.5, 0.5], climbing: [1, 0], descending: [0, 1] };
    const randomShape = [[0.9, 0.2], [0.2, 0.8], [0.7, 0], [0.1, 1], [1, 0.4]];
    const planes = [];
    for (let i = 0; i < count; i++) {
      const rtl = dir === 'right to left' || (dir === 'alternate' && i % 2 === 1);
      let ya, yb;
      if (avoid) {
        const [sa, sb] = path === 'random' ? randomShape[i] : shape[path];
        const room = Math.max(0, lane - planeH);
        const base = i * lane - planeH * 0.15;
        ya = Math.round(base + sa * room);
        yb = Math.round(base + sb * room);
      } else {
        [ya, yb] = path === 'random' ? randomish[i] : paths[path];
      }
      const x0 = rtl ? 110 : -size - 10;
      const x1 = rtl ? -size - 10 : 110;
      // The plane art already points its nose about 21deg up. Turn it so the nose follows the actual flight path.
      const GLASS_W = 254, GLASS_H = 365, NOSE = 21;
      const travelUp = Math.atan2(-(yb - ya) / 100 * GLASS_H, Math.abs(x1 - x0) / 100 * GLASS_W) * 180 / Math.PI;
      const tilt = Math.round((rtl ? travelUp - NOSE : NOSE - travelUp) * 10) / 10;
      const delay = first + i * gap;
      const iter = repeat ? 'infinite' : '1';
      const drawAnim = (p.trailFade ?? true) ? 'tin-draw' : 'tin-draw-keep';
      planes.push({
        trail,
        // Straight contrail from the tail, pointed back along the plane's own axis (the art is drawn 21deg nose-up).
        trailStyle: `position: absolute; right: 84%; top: 67%; width: ${p.trailLength ?? 140}%; height: ${Math.max(2, Math.round(size * 0.09 * 10) / 10)}px; margin-top: -1.5px; border-radius: 2px; background: linear-gradient(to left, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.55) 45%, rgba(255, 255, 255, 0)); transform-origin: 100% 50%; rotate: -${NOSE}deg; opacity: 0.85; clip-path: inset(0 0 0 100%); animation: ${drawAnim} ${dur}s ${ease} ${delay}s ${iter} both;`,
        style: `position: absolute; width: ${size}%; --x0: ${x0}%; --x1: ${x1}%; --y0: ${ya}%; --y1: ${yb}%; left: ${x0}%; top: ${ya}%; animation: tin-fly ${dur}s ${ease} ${delay}s ${iter} both;`,
        flip: `position: relative; transform: rotate(${tilt}deg)${rtl ? ' scaleX(-1)' : ''};`
      });
    }
    const whisking = !!(this.state && this.state.whisking);
    const spin = p.whiskSpeed ?? 0.35;
    const swirlStyle = whisking
      ? 'position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(240, 255, 205, 0.6) 0deg 9deg, rgba(0, 0, 0, 0) 9deg 36deg), radial-gradient(circle, rgba(236, 248, 200, 0.7), rgba(0, 0, 0, 0) 65%); opacity: 0.95; transition: opacity 0.4s; animation: tin-swirl 0.7s linear infinite;'
      : 'position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(240, 255, 205, 0.45) 0deg 9deg, rgba(0, 0, 0, 0) 9deg 36deg); opacity: 0.35; transition: opacity 0.6s; animation: tin-swirl 14s linear infinite;';
    // Hover: the whisk fades in tilted where it rests, turns upright over the bowl, then dips into the matcha. Click: it whisks in place.
    const whiskOuter = 'position: absolute; left: 58px; top: -53px; width: 91px; height: 138px; pointer-events: none; transform-origin: 50% 50%;' + (whisking ? ' opacity: 1; translate: 0 -30px; rotate: 0deg;' : '');
    const whiskDip = 'width: 100%; height: 100%;' + (whisking ? ' translate: 0 30px;' : '');
    const whiskStyle = 'width: 100%; height: 100%; transform-origin: 50% 8%;' + (whisking ? ` animation: tin-whisking ${spin}s ease-in-out infinite;` : '');
    const variant = p.swirlVariant ?? 'spiral';
    const f = whisking ? 0.1 : 1;
    const spinStyle = `position: absolute; inset: 0; opacity: ${whisking ? 1 : 0.8}; transition: opacity 0.4s; --d: ${9 * f}s; --d1: ${5 * f}s; --d2: ${8 * f}s; --d3: ${12 * f}s;`;
    const matchaStyle = `position: absolute; left: ${p.matchaX ?? 154}px; top: ${p.matchaY ?? 569}px; width: 206px; height: 189px; padding: 0; border: 0; background: none; cursor: pointer; scale: ${(p.matchaScale ?? 100) / 100}; transform-origin: 50% 100%;`;
    const whisk = () => {
      this.setState({ whisking: true });
      clearTimeout(this._whiskTimer);
      this._whiskTimer = setTimeout(() => this.setState({ whisking: false }), (p.whiskSeconds ?? 2.4) * 1000);
    };
    const st = this.state || {};
    const sx = st.sx || 0, sy = st.sy || 0, dragging = !!st.dragging;
    const dragStyle = `position: absolute; inset: 0; z-index: 6; translate: ${sx}px ${sy}px; cursor: ${dragging ? 'grabbing' : 'grab'}; touch-action: none; user-select: none; transition: scale 0.2s, rotate 0.2s, filter 0.2s; ${dragging ? 'scale: 1.06; rotate: -3deg; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.22));' : 'filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.08));'}`;
    const dragStart = (e) => {
      const el = e.currentTarget;
      if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
      const r = el.getBoundingClientRect();
      const k = el.offsetWidth ? r.width / el.offsetWidth : 1;
      this._drag = { x: e.clientX, y: e.clientY, sx, sy, k: k || 1 };
      this.setState({ dragging: true });
    };
    const dragMove = (e) => {
      const d = this._drag;
      if (!d) return;
      this.setState({ sx: d.sx + (e.clientX - d.x) / d.k, sy: d.sy + (e.clientY - d.y) / d.k });
    };
    const dragEnd = () => { this._drag = null; this.setState({ dragging: false }); };
    return { flying: animate, still: !animate, planes, swirlStyle, whiskOuter, whiskDip, whiskStyle, whisk, spinStyle, matchaStyle, vFan: variant === 'fan', drawn: variant !== 'fan', vSpiral: variant === 'spiral', vRings: variant === 'rings', vVortex: variant === 'vortex', dragStyle, dragStart, dragMove, dragEnd };
  }
  componentWillUnmount() { clearTimeout(this._whiskTimer); }
}
</script>
</body>
</html>
