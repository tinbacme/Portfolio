<style>
@font-face { font-family: "Geist Serif"; src: url("/_blob/7e30fdbbbab8996f8ff56a6dbd54e97f") format("woff2"); font-weight: 400; font-display: swap; }
body{margin:0}
a{color:#1b2930;text-decoration:none}a:hover{color:#000}
@keyframes tin-fly { from { left: var(--x0); top: var(--y0); } to { left: var(--x1); top: var(--y1); } }
@keyframes tin-draw { 0% { clip-path: inset(0 0 0 100%); opacity: 0.85; } 60% { clip-path: inset(0 0 0 0); } 85% { opacity: 0.85; } 100% { clip-path: inset(0 0 0 0); opacity: 0; } }
@keyframes tin-draw-keep { 0% { clip-path: inset(0 0 0 100%); } 60% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 0 0 0); } }
.tin-stamp-art { transition: rotate 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
.tin-postmark { transition: translate 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s; }
.tin-stamp:hover .tin-stamp-art { rotate: 4deg; }
.tin-stamp:hover .tin-postmark { translate: 36px -6px; animation: tin-wave 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.5s infinite; }
@keyframes tin-wave { 0% { translate: 36px -6px; opacity: 1; } 70% { translate: 64px -10px; opacity: 0; } 71% { translate: 20px -4px; opacity: 0; } 100% { translate: 36px -6px; opacity: 1; } }
.tin-whisk { opacity: 0; translate: 0 -18px; transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), translate 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
.tin-matcha:hover .tin-whisk, .tin-matcha:focus-visible .tin-whisk { opacity: 1; translate: 0 0; }
.tin-matcha:focus-visible { outline: 2px solid #3078e7; outline-offset: 6px; border-radius: 12px; }
@keyframes tin-whisking { 0% { translate: -18px 0; rotate: -7deg; } 50% { translate: 18px 3px; rotate: 7deg; } 100% { translate: -18px 0; rotate: -7deg; } }
@keyframes tin-swirl { to { rotate: 360deg; } }
@media (prefers-reduced-motion: reduce) { [style*="tin-fly"], [style*="tin-draw"] { animation: none !important; clip-path: none !important; } .tin-stamp:hover .tin-postmark { animation: none; } [style*="tin-whisking"], [style*="tin-swirl"] { animation: none !important; } }
</style>
  </helmet>

<script type="text/x-dc" data-dc-script data-props="{&quot;avoidOverlap&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Planes&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Planes&quot;},&quot;planeCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:5,&quot;section&quot;:&quot;Planes&quot;},&quot;firstDelay&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:2,&quot;min&quot;:0,&quot;max&quot;:10,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;When&quot;},&quot;interval&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:3,&quot;min&quot;:0.5,&quot;max&quot;:15,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;When&quot;},&quot;repeat&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;When&quot;},&quot;duration&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:6,&quot;min&quot;:1,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;How&quot;},&quot;direction&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;left to right&quot;,&quot;options&quot;:[&quot;left to right&quot;,&quot;right to left&quot;,&quot;alternate&quot;],&quot;section&quot;:&quot;How&quot;},&quot;path&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;random&quot;,&quot;options&quot;:[&quot;level&quot;,&quot;climbing&quot;,&quot;descending&quot;,&quot;random&quot;],&quot;section&quot;:&quot;How&quot;},&quot;easing&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ease-in-out&quot;,&quot;options&quot;:[&quot;linear&quot;,&quot;ease-in-out&quot;,&quot;ease-out&quot;],&quot;section&quot;:&quot;How&quot;},&quot;planeSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:36,&quot;min&quot;:15,&quot;max&quot;:60,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;section&quot;:&quot;How&quot;},&quot;contrail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Trail&quot;},&quot;trailLength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:140,&quot;min&quot;:60,&quot;max&quot;:320,&quot;step&quot;:10,&quot;unit&quot;:&quot;%&quot;,&quot;section&quot;:&quot;Trail&quot;},&quot;trailFade&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Trail&quot;},&quot;whiskSeconds&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:2.4,&quot;min&quot;:0.5,&quot;max&quot;:8,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Matcha&quot;},&quot;whiskSpeed&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.35,&quot;min&quot;:0.15,&quot;max&quot;:1.2,&quot;step&quot;:0.05,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Matcha&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const animate = p.animate ?? true;
    const count = Math.max(1, Math.min(5, p.planeCount ?? 2));
    const first = p.firstDelay ?? 0.5;
    const gap = p.interval ?? 3;
    const dur = p.duration ?? 6;
    const dir = p.direction ?? 'left to right';
    const path = p.path ?? 'climbing';
    const ease = p.easing ?? 'linear';
    const size = p.planeSize ?? 36;
    const trail = p.contrail ?? true;
    const repeat = p.repeat ?? true;
    const avoid = p.avoidOverlap ?? true;
    const paths = { level: [45, 45], climbing: [75, 12], descending: [12, 75] };
    const randomish = [[70, 20], [30, 55], [60, 10], [20, 70], [50, 35]];
    // Lane mode: each plane keeps to its own horizontal band of the window, so paths never cross.
    // Plane height as % of the glass height is about half its width setting.
    const planeH = size * 0.5;
    const lane = 100 / count;
    const shape = { level: [0.5, 0.5], climbing: [1, 0], descending: [0, 1] };
    const randomShape = [[0.9, 0.2], [0.2, 0.8], [0.7, 0], [0.1, 1], [1, 0.4]];
    const planes = [];
    for (let i = 0; i < count; i++) {
      const rtl = dir === 'right to left' || (dir === 'alternate' && i % 2 === 1);
      let ya, yb;
      if (avoid) {
        const [sa, sb] = path === 'random' ? randomShape[i] : shape[path];
        const room = Math.max(0, lane - planeH);
        const base = i * lane - planeH * 0.15;
        ya = Math.round(base + sa * room);
        yb = Math.round(base + sb * room);
      } else {
        [ya, yb] = path === 'random' ? randomish[i] : paths[path];
      }
      const x0 = rtl ? 110 : -size - 10;
      const x1 = rtl ? -size - 10 : 110;
      const tilt = (yb - ya) * 0.35 * (rtl ? -1 : 1);
      const delay = first + i * gap;
      const iter = repeat ? 'infinite' : '1';
      const drawAnim = (p.trailFade ?? true) ? 'tin-draw' : 'tin-draw-keep';
      planes.push({
        trail,
        trailStyle: `position: absolute; right: 84%; top: 67%; width: ${p.trailLength ?? 190}%; max-width: none; opacity: 0.85; clip-path: inset(0 0 0 100%); animation: ${drawAnim} ${dur}s ${ease} ${delay}s ${iter} both;`,
        style: `position: absolute; width: ${size}%; --x0: ${x0}%; --x1: ${x1}%; --y0: ${ya}%; --y1: ${yb}%; left: ${x0}%; top: ${ya}%; animation: tin-fly ${dur}s ${ease} ${delay}s ${iter} both;`,
        flip: `position: relative; transform: rotate(${tilt}deg)${rtl ? ' scaleX(-1)' : ''};`
      });
    }
    const whisking = !!(this.state && this.state.whisking);
    const spin = p.whiskSpeed ?? 0.35;
    const swirlStyle = whisking
      ? 'position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(240, 255, 205, 0.6) 0deg 9deg, rgba(0, 0, 0, 0) 9deg 36deg), radial-gradient(circle, rgba(236, 248, 200, 0.7), rgba(0, 0, 0, 0) 65%); opacity: 0.95; transition: opacity 0.4s; animation: tin-swirl 0.7s linear infinite;'
      : 'position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(240, 255, 205, 0.45) 0deg 9deg, rgba(0, 0, 0, 0) 9deg 36deg); opacity: 0.35; transition: opacity 0.6s; animation: tin-swirl 14s linear infinite;';
    const whiskBase = 'position: absolute; left: 74px; top: -19px; width: 58px; height: 93px; pointer-events: none; transform-origin: 50% 0%;';
    const whiskStyle = whisking
      ? whiskBase + ` opacity: 1; translate: 0 0; animation: tin-whisking ${spin}s ease-in-out infinite;`
      : whiskBase;
    const whisk = () => {
      this.setState({ whisking: true });
      clearTimeout(this._whiskTimer);
      this._whiskTimer = setTimeout(() => this.setState({ whisking: false }), (p.whiskSeconds ?? 2.4) * 1000);
    };
    return { flying: animate, still: !animate, planes, swirlStyle, whiskStyle, whisk };
  }
  componentWillUnmount() { clearTimeout(this._whiskTimer); }
}
</script>
