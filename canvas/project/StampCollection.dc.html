<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stamp collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1b2930}a:hover{color:#000}
</style>
</helmet>
<div style="width: 1440px; height: 640px; box-sizing: border-box; padding: 52px 64px; display: flex; flex-direction: column; gap: 32px; background: #f7f5ef; color: #1b2930; font-family: 'Instrument Sans', system-ui, sans-serif;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <h2 style="margin: 0; font-size: 34px; font-weight: 600;">Stamp collection: places Tin has been</h2>
    <p style="margin: 0; font-size: 16px; color: #5c6670;">No wording: the landscape says where it is. Textured 3D paper kept; the illustrations are simplified so they read on a phone.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px;">
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="height: 330px; display: flex; align-items: center; justify-content: center;"><img src="/_blob/f12c7dbaca27f2809f2f668b42419520" alt="Postage stamp: Da Lat" style="{{ shadow }}"></div>
      <figcaption style="font-size: 17px; font-weight: 600;">Da Lat</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="height: 330px; display: flex; align-items: center; justify-content: center;"><img src="/_blob/6883b06db8c06cdc2e6bd23b5ed13b4f" alt="Postage stamp: Japan" style="{{ shadow }}"></div>
      <figcaption style="font-size: 17px; font-weight: 600;">Japan</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="height: 330px; display: flex; align-items: center; justify-content: center;"><img src="/_blob/76e36a6f5886b41f9bb1dbac8e421c13" alt="Postage stamp: Singapore" style="{{ shadow }}"></div>
      <figcaption style="font-size: 17px; font-weight: 600;">Singapore</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="height: 330px; display: flex; align-items: center; justify-content: center;"><img src="/_blob/71791373d1180eab7453821a626b986a" alt="Postage stamp: Oregon" style="{{ shadow }}"></div>
      <figcaption style="font-size: 17px; font-weight: 600;">Oregon</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="height: 330px; display: flex; align-items: center; justify-content: center;"><img src="/_blob/b16051c52958e9a94a44eea6f538df40" alt="Postage stamp: Washington" style="{{ shadow }}"></div>
      <figcaption style="font-size: 17px; font-weight: 600;">Washington</figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"shadow":{"editor":"enum","default":"lifted","options":["none","flat","lifted","floating"],"section":"Shadow"},"$preview":{"width":1440,"height":640}}'>
// Shadows are drawn by the browser (CSS drop-shadow follows the perforated edge), not baked into the images.
const SHADOWS = {
  none: 'none',
  flat: 'drop-shadow(0 1px 1px rgba(40, 32, 20, 0.18))',
  lifted: 'drop-shadow(0 1px 1px rgba(40, 32, 20, 0.16)) drop-shadow(0 8px 12px rgba(40, 32, 20, 0.14))',
  floating: 'drop-shadow(0 2px 2px rgba(40, 32, 20, 0.14)) drop-shadow(0 22px 28px rgba(40, 32, 20, 0.18))',
};
class Component extends DCLogic {
  renderVals() {
    const f = SHADOWS[this.props.shadow ?? 'lifted'] || SHADOWS.lifted;
    return { shadow: `display: block; max-height: 330px; max-width: 220px; width: auto; height: auto; filter: ${f};` };
  }
}
</script>
</body>
</html>
